[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", ".venv", "data", "state", "frontend", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These scripts must extend sys.path before importing the packages they check.
"scripts/*.py" = ["E402"]
