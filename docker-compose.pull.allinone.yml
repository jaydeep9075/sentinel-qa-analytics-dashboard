# The simplest possible way to run this stack: ONE image, ONE container,
# ONE command. No git clone, no build, no second compose file for a second
# service.
#
#     curl -O https://raw.githubusercontent.com/jaydeep9075/sentinel-qa-analytics-dashboard/main/docker-compose.pull.allinone.yml
#     curl -O https://raw.githubusercontent.com/jaydeep9075/sentinel-qa-analytics-dashboard/main/.env.example
#     cp .env.example .env      # edit it - see .env.example section A/B
#     docker compose -f docker-compose.pull.allinone.yml pull
#     docker compose -f docker-compose.pull.allinone.yml up -d
#
# Trades independent backend/frontend restarts, resource limits and scaling
# (what docker-compose.pull.yml, the two-image version, gives you) for
# distribution simplicity. Pick this one for "I just want to try it" or a
# single-host demo; pick docker-compose.pull.yml if you actually care about
# that independence. Storage is still 100% yours - same
# DATA_DIR/STATE_DIR/INGEST_SOURCE_DIR bind mounts as every other compose
# file here, pointing at plain folders next to this file by default.

name: sentinel-qa-allinone

services:
  app:
    image: ${IMAGE_NAMESPACE:-jaydeepjoshi9403}/sentinel-qa:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SENTINEL_DATA_DIR: /app/data
      SENTINEL_STATE_DIR: /app/state
      SENTINEL_CONFIG2_PATH: /app/state/config2.json
      AUTO_INGEST_DIR: /app/ingest-source
      AUTH_USER_STORE_URL: ${AUTH_USER_STORE_URL:-sqlite:////app/state/users.db}
      AUTO_INGEST_ENABLED: ${AUTO_INGEST_ENABLED:-false}
      AUTO_INGEST_INTERVAL_SECONDS: ${AUTO_INGEST_INTERVAL_SECONDS:-30}
      AUTO_INGEST_STABLE_SECONDS: ${AUTO_INGEST_STABLE_SECONDS:-20}
      AUTO_INGEST_DEFAULT_WORKSPACE: ${AUTO_INGEST_DEFAULT_WORKSPACE:-default}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${STATE_DIR:-./state}:/app/state
      - ${INGEST_SOURCE_DIR:-./ingest-source}:/app/ingest-source
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health', timeout=3); urllib.request.urlopen('http://localhost:3000/', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
