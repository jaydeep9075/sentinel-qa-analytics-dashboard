# Paths follow one rule: the paths INSIDE the containers are fixed
# (/app/data, /app/state, /app/ingest-source) and the HOST side of every
# mount is a variable. To run against storage somewhere else - a second disk,
# a cloud block volume, an NFS/SMB share - you change the host path in .env
# and nothing else. The app keeps seeing /app/data either way, so no rebuild
# and no code change is involved.
#
#   DATA_DIR           -> /app/data           (all ingestions + live runs)
#   STATE_DIR          -> /app/state          (users.db + config2.json)
#   INGEST_SOURCE_DIR  -> /app/ingest-source  (drop-box, watched if enabled)
#
# EVERY mount here is a DIRECTORY, deliberately. Docker bind-mounts a
# single FILE only if that file already exists on the host; if it doesn't,
# it silently creates a DIRECTORY at that path and the container fails in a
# way that reads as a application bug. users.db and config2.json used to be
# mounted that way, which is why first-run needed a `touch users.db` step and
# a batch script to do it for you. Mounting the directory that CONTAINS them
# removes the failure mode entirely: Docker creates a missing directory
# happily, and the backend seeds the files inside it on startup.
#
# The result is that a fresh clone needs exactly one thing - a filled-in
# .env - and then `docker compose up -d`. See .env.example.

name: sentinel-qa

services:
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    # Naming it here (not just letting `build` produce an anonymous tag) is
    # what makes `docker compose push` work, and what lets a teammate who
    # has no copy of this repo run `docker compose -f docker-compose.pull.yml
    # pull` instead. IMAGE_NAMESPACE/IMAGE_TAG default to this maintainer's
    # Docker Hub account - override both in .env if you fork this and want
    # to publish under your own.
    image: ${IMAGE_NAMESPACE:-jaydeepjoshi9403}/sentinel-qa-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      # Frontend's published port from the host's perspective - keep this
      # in sync with the frontend service's ports mapping below, and with
      # NEXT_PUBLIC_API_URL passed to the frontend build.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Fixed container-side mount points - the same two variable names the
      # frontend uses, so one concept covers both services. Don't change
      # these to relocate storage; change DATA_DIR/INGEST_SOURCE_DIR (host
      # side) in .env instead.
      SENTINEL_DATA_DIR: /app/data
      AUTO_INGEST_DIR: /app/ingest-source
      # Auth DB and ingester config live in the mounted state directory.
      # Set here rather than left to .env so an old .env carrying
      # `sqlite:///./users.db` can't quietly point the container at a path
      # inside its own filesystem, where the database would vanish on the
      # next `docker compose down`.
      SENTINEL_STATE_DIR: /app/state
      AUTH_USER_STORE_URL: ${AUTH_USER_STORE_URL:-sqlite:////app/state/users.db}
      SENTINEL_CONFIG2_PATH: /app/state/config2.json
      # Drop-box watcher, off by default. On: anything written into
      # INGEST_SOURCE_DIR is ingested automatically once its size stops
      # changing - no "Add Build" click, no `docker compose run ingest`.
      AUTO_INGEST_ENABLED: ${AUTO_INGEST_ENABLED:-false}
      AUTO_INGEST_INTERVAL_SECONDS: ${AUTO_INGEST_INTERVAL_SECONDS:-30}
      AUTO_INGEST_STABLE_SECONDS: ${AUTO_INGEST_STABLE_SECONDS:-20}
      # A file dropped at the top level of the drop-box belongs to this
      # workspace; a file under <drop-box>/<team>/ belongs to <team>.
      AUTO_INGEST_DEFAULT_WORKSPACE: ${AUTO_INGEST_DEFAULT_WORKSPACE:-default}
      # First-run only: creates one admin when the user table is empty, so a
      # fresh deployment is reachable without exec-ing into the container.
      # Ignored once any user exists.
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Ingested test data (LanceDB/DuckDB) - bind-mounted, not a named
      # volume, so the existing local `cd universal_ingester && python
      # ingester.py` workflow (run outside Docker) writes to the same place
      # this container reads from.
      - ${DATA_DIR:-./data}:/app/data
      # Mutable app state: users.db (auth) and config2.json (ingester
      # config). A DIRECTORY mount, so Docker creates it if absent and the
      # backend seeds the files inside on startup - nothing to prepare by
      # hand. Back this up along with DATA_DIR; it holds your accounts.
      - ${STATE_DIR:-./state}:/app/state
      # Raw data drop-box. Needed on the BACKEND (not just the one-shot
      # `ingest` service below) because the dashboard's "Add Build" button
      # posts a path to POST /ingest/config2, which the backend then reads
      # itself - so whatever you type there has to exist inside THIS
      # container. Drop files in ./ingest-source on the host and reference
      # them as /app/ingest-source/<file>. Not :ro - the Allure connector
      # extracts zips in place.
      - ${INGEST_SOURCE_DIR:-./ingest-source}:/app/ingest-source
      # Only needed if AUTH_AUTO_SEED_USERS=true - uncomment and create
      # ./auth_seed_users.json first (see auth_seed_users.json.example), or
      # this bind mount fails/creates an empty directory on a fresh clone.
      # - ./auth_seed_users.json:/app/auth_seed_users.json:ro
    # Container logs are unbounded by default and this service logs every
    # request - cap them so a long-running deployment can't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time (Next.js inlines NEXT_PUBLIC_* into the
        # client bundle) - this is the URL the BROWSER uses, so it must be
        # reachable from wherever the user's browser runs, not just from
        # inside the Docker network. For local docker-compose that's the
        # backend's published host port (matches BACKEND_PORT above).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    # See the backend's `image:` comment above - same reasoning.
    image: ${IMAGE_NAMESPACE:-jaydeepjoshi9403}/sentinel-qa-frontend:${IMAGE_TAG:-latest}
    environment:
      # Two route handlers run server-side inside this container and read
      # files that live at the REPO ROOT when you run from a checkout
      # (frontend/ -> ../data, ../config2.json). There is no repo root above
      # /app in the image, so point them at the mounts below instead:
      #   /api/builds        -> the Build Trends page's build list
      #   /api/config2-path  -> the dashboard's "Add Build" path box
      SENTINEL_DATA_DIR: /app/data
      SENTINEL_CONFIG2_PATH: /app/state/config2.json
    volumes:
      # Read-only: the frontend only lists ingestion folders/summary.json,
      # it never writes here - the backend and the ingester own this dir.
      - ${DATA_DIR:-./data}:/app/data:ro
      # Writable: PUT /api/config2-path persists the path you type in the
      # dashboard back into config2.json inside this directory.
      - ${STATE_DIR:-./state}:/app/state
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  # One-shot ingestion trigger - not a long-running server, so it's meant
  # to be run on demand, not started by a plain `docker compose up`:
  #   docker compose run --rm ingest
  # Reuses the backend image (universal_ingester's deps are already in
  # requirements.txt) with a different command/working_dir. Drop your raw
  # data (an Allure zip/folder, a DB connection config, anything one of
  # universal_ingester/connectors/*.py supports) under ./ingest-source/,
  # point config2.json's source `path` at /app/ingest-source/<whatever you
  # dropped>, then run the command above. Output lands in ./data - the
  # same volume `backend` already reads from - and shows up in the running
  # dashboard immediately (GET /ingestions), no restart needed.
  ingest:
    build:
      context: .
      dockerfile: services/Dockerfile
    # Same image as `backend` (identical context/dockerfile) - naming it
    # here too means `docker compose build` doesn't build it twice under a
    # different anonymous tag.
    image: ${IMAGE_NAMESPACE:-jaydeepjoshi9403}/sentinel-qa-backend:${IMAGE_TAG:-latest}
    profiles: ["ingest"]
    working_dir: /app/universal_ingester
    entrypoint: ["python", "ingester.py"]
    environment:
      SENTINEL_DATA_DIR: /app/data
      SENTINEL_CONFIG2_PATH: /app/state/config2.json
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${STATE_DIR:-./state}:/app/state
      - ${INGEST_SOURCE_DIR:-./ingest-source}:/app/ingest-source

  # Optional - only needed once you run more than one `backend` instance
  # behind a load balancer (REDIS_URL wires the live SSE bus + live-frame
  # cache to work across instances instead of just within one). A single
  # backend replica (the default above) doesn't need this at all.
  # Enable with: docker compose --profile multi-instance up
  redis:
    image: redis:7-alpine
    profiles: ["multi-instance"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    mem_limit: 256m
