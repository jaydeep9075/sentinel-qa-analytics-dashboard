; Runs both services inside the single all-in-one image (Dockerfile.allinone).
; No [supervisord] user= directive - the container's USER is already
; non-root (appuser, set in the Dockerfile), so supervisord doesn't need to
; drop privileges itself.

[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Backend first (priority=10 starts it before the frontend) since the
; frontend calls it for server-side routes on its own startup path.
[program:backend]
command=uvicorn services.main:app --host 0.0.0.0 --port 8000 --workers %(ENV_WEB_CONCURRENCY)s
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=node server.js
directory=/app/frontend
environment=PORT="3000",HOSTNAME="0.0.0.0"
priority=20
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
